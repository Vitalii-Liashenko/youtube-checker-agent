<!DOCTYPE html>
<html>
<head>
  <title>YouTube AutoPlay Controller</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
    }
    .status {
      margin: 10px 0;
      padding: 5px;
      border-radius: 4px;
    }
    .active {
      background-color: #e6ffe6;
      color: #006600;
    }
    .inactive {
      background-color: #ffe6e6;
      color: #660000;
    }
  </style>
</head>
<body>
  <h2>YouTube AutoPlay Controller</h2>
  <div id="status" class="status">Checking status...</div>
  <script src="popup.js"></script>
</body>
</html>
